<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Master Heart Lock - Universal</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1a1a;
            --heart-red: #d63031;
            --heart-gold: #f1c40f;
            --metal-plate: linear-gradient(145deg, #2e2e2e, #1a1a1a);
            /* Biến scale để điều chỉnh kích thước tổng thể nhanh chóng */
            --base-scale: clamp(0.7, 4vw, 1.2); 
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; /* Tắt highlight xanh khi chạm trên mobile */
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #121212;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            padding: 20px;
        }

        /* Nền phát sáng linh hoạt */
        body::before {
            content: "";
            position: absolute;
            width: 80vmax;
            height: 80vmax;
            background: radial-gradient(circle, rgba(214, 48, 49, 0.1), transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .main-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: scale(var(--base-scale)); /* Scale toàn bộ dựa trên kích thước màn hình */
            transition: transform 0.3s ease;
        }

        /* --- QUAI KHÓA --- */
        .shackle-container {
            position: absolute;
            top: -70px;
            width: 130px;
            height: 160px;
            z-index: 1;
        }

        .shackle {
            width: 100%;
            height: 100%;
            border: 22px solid #333;
            border-bottom: none;
            border-radius: 65px 65px 0 0;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.5), inset 5px 0 10px rgba(255,255,255,0.05);
        }

        /* --- THÂN KHÓA --- */
        .heart-lock {
            position: relative;
            width: 260px;
            height: 230px;
            z-index: 2;
            cursor: pointer;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.8));
            transition: transform 0.3s ease;
        }

        .heart-lock::before,
        .heart-lock::after {
            content: "";
            position: absolute;
            top: 0;
            width: 130px;
            height: 210px;
            background: var(--heart-red);
            border-radius: 130px 130px 0 0;
            transition: background 0.6s, box-shadow 0.6s;
            box-shadow: 
                inset -15px -15px 30px rgba(0,0,0,0.5),
                inset 10px 10px 20px rgba(255,255,255,0.2);
        }

        .heart-lock::before { left: 130px; transform: rotate(-45deg); transform-origin: 0 100%; }
        .heart-lock::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }

        .keyhole-complex {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: #000;
            border-radius: 50%;
            z-index: 10;
            border: 4px solid #222;
        }

        /* --- BẢNG SỐ --- */
        .combination-wheel {
            margin-top: 50px;
            display: flex;
            gap: 15px;
            padding: 20px;
            background: var(--metal-plate);
            border-radius: 25px;
            border: 1px solid #333;
            box-shadow: 10px 10px 20px #000;
        }

        .wheel-digit {
            background: #000;
            width: 55px;
            height: 90px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #444;
        }

        .num {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .nav-btn {
            background: #222;
            border: none;
            color: #888;
            height: 25px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-btn:active { background: #333; color: white; }

        /* --- RESPONSIVE TRẠNG THÁI MỞ --- */
        .is-unlocked .shackle {
            transform: translateY(-65px) rotate(-15deg);
        }

        .is-unlocked .heart-lock::before,
        .is-unlocked .heart-lock::after {
            background: var(--heart-gold);
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.3), inset 10px 10px 40px rgba(255,255,255,0.6);
        }

        .is-unlocked .heart-lock { animation: heartBeat 1.2s infinite; }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .status-msg {
            margin-top: 25px;
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #555;
            text-align: center;
        }

        .is-unlocked .status-msg { color: var(--heart-gold); }

        /* Hiệu ứng Zoom khi hoàn tất */
        .opening { animation: zoomOut 0.8s forwards; }
        @keyframes zoomOut {
            to { transform: scale(30); opacity: 0; }
        }

        /* --- MEDIA QUERIES --- */
        @media (max-height: 600px) {
            .main-wrapper { transform: scale(0.6); }
            .combination-wheel { margin-top: 30px; }
        }

        @media (max-width: 400px) {
            .combination-wheel { gap: 10px; padding: 15px; }
            .wheel-digit { width: 45px; height: 80px; }
            .num { font-size: 30px; }
        }
    </style>
</head>
<body>

<div class="main-wrapper" id="wrapper">
    <div class="shackle-container">
        <div class="shackle"></div>
    </div>

    <div class="heart-lock" id="lock" onclick="openPortal()">
        <div class="keyhole-complex"></div>
    </div>

    <div class="combination-wheel">
        <script>
            // Render 3 cột số tự động
            for(let i=0; i<3; i++) {
                document.write(`
                    <div class="wheel-digit">
                        <button class="nav-btn" onclick="spin(${i}, 1)">▲</button>
                        <div class="num" id="d${i}">0</div>
                        <button class="nav-btn" onclick="spin(${i}, -1)">▼</button>
                    </div>
                `);
            }
        </script>
    </div>

    <p class="status-msg" id="status">Hãy nhập đúng mật mã để mở khóa!</p>
</div>

<script>
    const secret = "271"; // Mã số của bạn
    let current = [0, 0, 0];
    let unlocked = false;

    function spin(idx, dir) {
        if(unlocked) return;
        
        current[idx] = (current[idx] + dir + 10) % 10;
        const el = document.getElementById(`d${idx}`);
        
        // Hiệu ứng chuyển động số mượt hơn
        el.style.transform = `translateY(${dir * 20}px)`;
        el.style.opacity = "0";
        
        setTimeout(() => {
            el.textContent = current[idx];
            el.style.transform = `translateY(${dir * -20}px)`;
            setTimeout(() => {
                el.style.transform = "translateY(0)";
                el.style.opacity = "1";
            }, 10);
        }, 100);

        if(current.join('') === secret) {
            triggerUnlock();
        }
    }

    function triggerUnlock() {
        unlocked = true;
        document.getElementById('wrapper').classList.add('is-unlocked');
        document.getElementById('status').textContent = "Đã mở khóa thành công - vào ổ khóa để mở!";
        
        if (navigator.vibrate) navigator.vibrate([150, 50, 150]);
    }

    function openPortal() {
        if(!unlocked) {
            const lock = document.getElementById('lock');
            lock.style.animation = "shake 0.3s";
            setTimeout(() => lock.style.animation = "", 300);
            return;
        }

        document.getElementById('wrapper').classList.add('opening');
        setTimeout(() => {
            window.location.href = "gift3.html";
        }, 700);
    }
</script>

<style>
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-10px); }
        40%, 80% { transform: translateX(10px); }
    }
</style>

</body>
</html>
