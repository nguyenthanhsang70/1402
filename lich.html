<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Valentine ♥</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #fff0f5, #ffe4e1);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #d6336c;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 620px;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 2px solid #ffb6c1;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -50px;
      left: -50px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #fff0f5 0%, transparent 70%);
      opacity: 0.6;
      z-index: 0;
    }

    h1 {
      font-size: 2.4em;
      color: #ff69b4;
      margin: 10px 0 25px;
      font-family: 'Brush Script MT', cursive;
      position: relative;
      z-index: 1;
    }

    .calendar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      position: relative;
      z-index: 1;
    }

    .calendar {
      width: 320px;
      background: #fff0f5;
      border: 2px solid #ffb6c1;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(255, 105, 180, 0.25);
    }

    .month-title {
      background: #ff69b4;
      color: white;
      padding: 12px;
      font-size: 1.4em;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      text-align: center;
      font-size: 1.05em;
      cursor: default;
    }

    th {
      background: #ffe4e1;
      color: #c71585;
    }

    td {
      border: 1px solid #ffe4e1;
    }

    td:hover {
      background: #fff0f5;
    }

    .heart-day {
      position: relative;
      color: #ff1493;
      font-weight: bold;
      cursor: pointer;
    }

    .heart-day:hover {
      transform: scale(1.15);
      transition: 0.3s;
    }

    .heart-day::after {
      content: "♥";
      position: absolute;
      font-size: 0.9em;
      top: 2px;
      right: 2px;
    }

    .bottom-text {
      margin-top: 30px;
      font-size: 1.4em;
      color: #d6336c;
      font-weight: bold;
      line-height: 1.5;
      position: relative;
      z-index: 1;
    }

    .bottom-text span {
      color: #ff1493;
      font-size: 1.6em;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: linear-gradient(135deg, #fff5f7, #ffeef2);
      padding: 30px;
      border-radius: 25px;
      width: 90%;
      max-width: 480px;
      text-align: center;
      border: 4px dashed #ff69b4;
      box-shadow: 0 15px 40px rgba(255, 105, 180, 0.5);
      position: relative;
      animation: popIn 0.6s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      80% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }

    .close {
      position: absolute;
      top: 10px;
      right: 20px;
      color: #ff1493;
      font-size: 2em;
      cursor: pointer;
    }

    .close:hover {
      color: #c71585;
    }

    .modal h2 {
      color: #ff1493;
      font-family: 'Brush Script MT', cursive;
      font-size: 2.5em;
      margin: 0 0 20px;
    }

    .modal p {
      color: #d6336c;
      font-size: 1.3em;
      line-height: 1.6;
      margin: 0;
      white-space: pre-wrap; /* Giữ xuống dòng */
    }

    #typed-text {
      min-height: 120px;
      display: inline-block;
      text-align: left;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background: #ff1493;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      from, to { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (max-width: 500px) {
      .calendar { width: 280px; }
      h1 { font-size: 2.1em; }
      .modal-content { padding: 20px; }
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Happy Valentine</h1>

  <div class="calendar-container">
    <div class="calendar">
      <div class="month-title">February 2026</div>
      <table>
        <thead>
          <tr>
            <th>S</th><th>M</th><th>T</th><th>W</th><th>T</th><th>F</th><th>S</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td><td></td><td></td><td></td><td></td><td>1</td><td>2</td>
          </tr>
          <tr>
            <td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td>
          </tr>
          <tr>
            <td>10</td><td>11</td><td>12</td><td>13</td>
            <td class="heart-day" id="valentine-day">14</td>
            <td>15</td><td>16</td>
          </tr>
          <tr>
            <td>17</td><td>18</td><td>19</td><td>20</td><td>21</td><td>22</td><td>23</td>
          </tr>
          <tr>
            <td>24</td><td>25</td><td>26</td><td>27</td><td>28</td><td></td><td></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="bottom-text">
    Bấm vào vào bất ngờ đi nèeee<span>~ ♥</span>
  </div>
</div>

<!-- Modal -->
<div id="myModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Gửi em yêu dấu nhất của anh</h2>
    <p id="typed-text"></p>
    <span class="cursor"></span>
  </div>
</div>

<script>
// Modal control
const modal = document.getElementById("myModal");
const valentineDay = document.getElementById("valentine-day");
const closeBtn = document.querySelector(".close");

valentineDay.onclick = function() {
  modal.style.display = "flex";
  startTyping(); // Bắt đầu hiệu ứng gõ chữ khi mở modal
}

closeBtn.onclick = function() {
  modal.style.display = "none";
  // Reset text khi đóng để lần sau mở lại sẽ gõ lại từ đầu
  document.getElementById("typed-text").innerHTML = "";
  i = 0;
}

// Đóng modal khi click bên ngoài
window.onclick = function(event) {
  if (event.target == modal) {
    modal.style.display = "none";
    document.getElementById("typed-text").innerHTML = "";
    i = 0;
  }
}

// Typewriter effect
let i = 0;
const txt = `Chào em, Valentine này anh không cần hoa, không cần socola...\nAnh chỉ cần được nói với em rằng:\n\nTừng ngày có em, mỗi buổi sáng thức dậy đều thấy điều tuyệt vời nhất\nLà có em trong tim anh. 💕\n\nYêu em nhiều lắm luôn nha! ♥`;
const speed = 60; // Tốc độ gõ (ms mỗi ký tự), càng nhỏ càng nhanh

function typeWriter() {
  if (i < txt.length) {
    const char = txt.charAt(i);
    document.getElementById("typed-text").innerHTML += char;
    i++;
    setTimeout(typeWriter, speed);
  }
}

function startTyping() {
  if (i === 0) { // Chỉ chạy nếu chưa gõ
    typeWriter();
  }
}
</script>

</body>
</html>
