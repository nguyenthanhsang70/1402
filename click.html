<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Valentine's Day baashi 😙</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      /* Background với họa tiết nhẹ */
      background: #f3f3f3 url('https://www.transparenttextures.com/patterns/noise-lines.png');
      font-family: 'Pacifico', cursive;
      overflow: hidden;
      color: #fff;
      height: 100vh;
      /* Căn giữa toàn bộ nội dung trên mọi màn hình */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bgoverlay {
      background: rgba(103, 58, 183, 0.7);
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .ico {
      display: inline-block;
      width: 250px; /* Kích thước vùng chứa trái tim trên mobile */
      height: 250px;
      position: relative;
      cursor: pointer;
      transition: transform 0.5s ease;
    }

    /* Tăng kích thước vùng chứa trên màn hình lớn */
    @media (min-width: 768px) {
      .ico {
        width: 320px;
        height: 320px;
      }
    }

    /* Hiệu ứng phóng đại khi click */
    .open .ico {
      animation: open 3s forwards;
    }

    .ico .title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      /* CHỮ CLICK ME NHỎ XÍU TẠI ĐÂY */
      font-size: 12px; 
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: all 0.4s ease;
      letter-spacing: 1px;
    }

    @media (min-width: 768px) {
      .ico .title {
        font-size: 18px; /* Vẫn nhỏ nhắn trên máy tính */
      }
    }

    .open .ico .title {
      opacity: 0;
    }

    /* Tạo hình trái tim bằng FontAwesome */
    .ico:before,
    .ico:after,
    .ico2:before,
    .ico2:after {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      font-size: 15em; /* Kích thước trái tim mobile */
      color: #ff4081;
      content: "\f004";
      font-family: FontAwesome;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @media (min-width: 768px) {
      .ico:before, .ico:after, .ico2:before, .ico2:after {
        font-size: 18em; /* Kích thước trái tim PC */
      }
    }

    .ico2:before,
    .ico2:after {
      color: #e91e63;
    }

    .ico:before   { z-index: 3; }
    
    /* Hiệu ứng nhịp đập/nổ lan tỏa */
    .ico:after    { animation: explode 3s infinite; }
    .ico2:before  { animation: explodeSmall 2.5s infinite; }
    .ico2:after   { animation: explodeSmall 1.8s infinite; }

    @keyframes explode {
      from { transform: scale(1);   opacity: 1; }
      to   { transform: scale(1.5); opacity: 0; }
    }

    @keyframes explodeSmall {
      from { transform: scale(1);   opacity: 1; }
      to   { transform: scale(1.18); opacity: 0; }
    }

    @keyframes open {
      from { transform: scale(1); }
      to   { transform: scale(12); } /* Phóng to che hết màn hình */
    }
  </style>
</head>
<body>

<div class="bgoverlay"></div>

<div class="container">
  <div class="ico">
    <div class="ico2"></div>
    <div class="title">Click Me</div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const ico = document.querySelector('.ico');
    const container = document.querySelector('.container');

    ico.addEventListener('click', function () {
      // Bắt đầu hiệu ứng mở
      container.classList.add('open');

      // Chờ hiệu ứng diễn ra một chút rồi chuyển trang
      setTimeout(function () {
        // HÃY THAY ĐỔI LINK DƯỚI ĐÂY THÀNH TRANG BẠN MUỐN
        window.location.href = "khoanhkhac.html";
      }, 800); 
    });
  });
</script>

</body>
</html>
