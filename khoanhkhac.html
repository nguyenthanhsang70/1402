<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>khoanhkhac</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap');
        body {
            font-family: 'Dancing Script', cursive;
            background: #FDE3A7;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            position: relative;
            width: 250px;
            height: 330px;
            background: #e0e1dc;
            transform: perspective(2000px);
            transform-style: preserve-3d;
            box-shadow: inset 300px 0 50px rgba(0,0,0,.5), 20px 0 60px rgba(0,0,0,.5);
            transition: 1s;
        }
        .card.opened {
            transform: perspective(2000px) rotate(15deg) scale(1.2);
            box-shadow: inset 20px 0 50px rgba(0,0,0,.5), 0 10px 100px rgba(0,0,0,.5);
        }
        .card:before {
            content:''; position: absolute; top: -5px; left: 0; width: 100%; height: 5px;
            background: #BAC1BA; transform: skewX(-45deg); transform-origin: bottom;
        }
        .card:after {
            content:''; position: absolute; top: 0; right: -5px; width: 5px; height: 100%;
            background: #92A29C; transform: skewY(-45deg); transform-origin: left;
        }
        .imgBox {
            width: 100%; height: 100%; position: absolute; transform-origin: left;
            transition: .7s; z-index: 2; top: 0; left: 0;
        }
        .bark {
            position: absolute; background: #e0e1dc; width: 100%; height: 100%;
            opacity: 0; transition: .7s;
        }
        .imgBox img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .card.opened .imgBox {
            transform: rotateY(-135deg);
        }
        .card.opened .bark {
            opacity: 1;
            box-shadow: 300px 200px 100px rgba(0, 0, 0, .4) inset;
        }
        /* SLIDESHOW */
        .slideshow {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            pointer-events: none;
        }
        .slideshow.active {
            opacity: 1;
            pointer-events: auto;
        }
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.2s ease;
        }
        .slide.active { opacity: 1; }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .slide-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.65);
            color: white;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-family: 'Dancing Script', cursive;
        }
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.85);
            border: none;
            font-size: 18px;
            padding: 10px 14px;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.3s;
            z-index: 10;
        }
        .nav-btn:hover { background: white; transform: translateY(-50%) scale(1.1); }
        .prev { left: 10px; }
        .next { right: 10px; }
        .dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: 0.3s;
        }
        .dot.active {
            background: #fff;
            width: 24px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="imgBox">
            <div class="bark"></div>
            <img src="biathiep.jfif" alt="Bìa thiệp">
        </div>

        <!-- SLIDESHOW -->
        <div class="slideshow" id="slideshow">
            <div class="slide active">
                <img src="khoanhkhac1.jfif" alt="Ảnh 1">
                <div class="slide-caption">Khoảnh khắc đáng nhớ 1</div>
            </div>
            <div class="slide">
                <img src="khoanhkhac2.jfif" alt="Ảnh 2">
                <div class="slide-caption">Khoảnh khắc đáng nhớ 2</div>
            </div>
            <div class="slide">
                <img src="khoanhkhac3.jfif" alt="Ảnh 3">
                <div class="slide-caption">Khoảnh khắc đáng nhớ 3</div>
            </div>
            <div class="slide">
                <img src="khoanhkhac4.jfif" alt="Ảnh 4">
                <div class="slide-caption">Khoảnh khắc đáng nhớ 4</div>
            </div>
            <div class="slide">
                <img src="khoanhkhac5.jfif" alt="Ảnh 5">
                <div class="slide-caption">Khoảnh khắc đáng nhớ 5</div>
            </div>
            <button class="nav-btn prev" onclick="changeSlide(-1)">❮</button>
            <button class="nav-btn next" onclick="changeSlide(1)">❯</button>
            <div class="dots">
                <span class="dot active" onclick="currentSlide(0)"></span>
                <span class="dot" onclick="currentSlide(1)"></span>
                <span class="dot" onclick="currentSlide(2)"></span>
                <span class="dot" onclick="currentSlide(3)"></span>
                <span class="dot" onclick="currentSlide(4)"></span>
            </div>
        </div>
    </div>

    <script>
        let currentSlideIndex = 0;
        let autoSlideInterval;
        const card = document.getElementById('card');
        const slideshow = document.getElementById('slideshow');
        const videoPageUrl = "#"; // ← THAY BẰNG LINK VIDEO THẬT CỦA BẠN Ở ĐÂY

        // Tự động mở thiệp và hiện slideshow
        setTimeout(() => {
            card.classList.add('opened');
            setTimeout(() => {
                slideshow.classList.add('active');
                startAutoSlide();
            }, 800);
        }, 4000);

        // === SLIDESHOW ===
        function showSlide(index) {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');

            if (index >= slides.length) {
                // Hết vòng → tự động chuyển sang trang video
                window.location.href = videoPageUrl;
                return;
            }
            if (index < 0) index = slides.length - 1;

            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active'));
            slides[index].classList.add('active');
            dots[index].classList.add('active');

            currentSlideIndex = index;
        }

        function changeSlide(direction) {
            currentSlideIndex += direction;
            showSlide(currentSlideIndex);
            resetAutoSlide();
        }

        function currentSlide(index) {
            currentSlideIndex = index;
            showSlide(currentSlideIndex);
            resetAutoSlide();
        }

        function startAutoSlide() {
            autoSlideInterval = setInterval(() => {
                currentSlideIndex++;
                showSlide(currentSlideIndex);
            }, 4000); // mỗi ảnh 4 giây – bạn có thể chỉnh thời gian
        }

        function resetAutoSlide() {
            clearInterval(autoSlideInterval);
            startAutoSlide();
        }
    </script>
</body>
</html>
