<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("https://images.unsplash.com/photo-1503455637927-730bce8583c0?q=80&w=2070&auto=format&fit=crop");
      background-size: cover;
      background-position: center;
    }
    .card {
      position: relative;
      width: 340px;
      height: 460px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: visible;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .card-content {
      padding: 20px;
      opacity: 0;
      display: none;
      text-align: center;
      z-index: 5;
    }
    .cord-wrapper {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 100%;
      cursor: grab;
      z-index: 15;
    }
    .plug {
      position: absolute;
      width: 45px;
      height: 65px;
      fill: #fe3a65;
      cursor: grab;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
    .plug:active { cursor: grabbing; }

    .text-intro {
      position: absolute;
      bottom: 40px;
      color: #888;
      font-size: 18px;
      font-weight: 500;
      pointer-events: none;
    }

    h1 { color: #fe3a65; font-size: 24px; margin-bottom: 15px; }
    img { border-radius: 12px; width: 100%; max-width: 260px; margin-bottom: 15px; }
    .buttons { 
      display: flex; 
      gap: 15px; 
      justify-content: center; 
      align-items: center; 
      margin-top: 10px;
      min-height: 100px;
      position: relative;
      width: 100%;
    }
    button {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: background 0.3s;
      white-space: nowrap;
      will-change: transform; /* giúp mượt hơn */
    }
    .yes { background: #4caf50; z-index: 6; }
    .no { 
      background: #f44336; 
      position: relative; 
      z-index: 5; 
    }
    .footer-text {
      position: absolute;
      bottom: 15px;
      font-size: 11px;
      color: white;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="wrapper">
  <div class="card">
    <p class="text-intro">Hãy kéo nó xuống ↓</p>
    
    <div class="card-content">
      <div class="valentine-main">
        <h1>Em có thích bất ngờ này không?</h1>
        <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2Vna2FkeDN2NHYxenduMXVuNTJ0MmJxZjI5dG16bXhoaGJuZmoxMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26FLdmIp6wJr91JAI/giphy.gif" alt="please" />
        <div class="buttons">
          <button class="yes">Có </button>
          <button class="no">Không </button>
        </div>
      </div>

      <div class="valentine-congrats" style="display:none;">
        <h1>Tuyệt vời!</h1>
        <p>Thay đồ đi tối anh qua chở em đi chơi!</p>
        <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExd2EwcDRyYXZyNjUwb2h0ZmRnd3R3d2wzMWRvNGR0ejBnMjduaHprYSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/n0IKF3qkeh671VAO45/giphy.gif" />
      </div>
    </div>

    <div class="cord-wrapper">
      <svg class="plug" viewBox="0 0 100 160">
        <path d="M30,0 L70,0 L90,40 L90,140 L10,140 L10,40 Z" />
        <circle cx="35" cy="20" r="5" fill="white"/>
        <circle cx="65" cy="20" r="5" fill="white"/>
      </svg>
    </div>
  </div>
  <div class="footer-text">Valentine 2026</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
// PHYSICS + CORD (giữ nguyên)
const card = document.querySelector(".card");
const plug = document.querySelector(".plug");
const cardRect = card.getBoundingClientRect();

const engine = Matter.Engine.create();
const world = engine.world;
const render = Matter.Render.create({
  element: document.getElementById("canvas-container"),
  engine: engine,
  options: {
    width: window.innerWidth,
    height: window.innerHeight,
    wireframes: false,
    background: "transparent"
  }
});

const segments = 8;
const points = [];
const startX = window.innerWidth / 2;
const startY = cardRect.top + 20;

for (let i = 0; i <= segments; i++) {
  const p = Matter.Bodies.circle(startX, startY + i * 15, 2, {
    isStatic: i === 0,
    friction: 0.5,
    render: { fillStyle: "#fe3a65" }
  });
  points.push(p);
  Matter.World.add(world, p);
}

for (let i = 0; i < points.length - 1; i++) {
  Matter.World.add(world, Matter.Constraint.create({
    bodyA: points[i], bodyB: points[i+1],
    stiffness: 0.2, length: 15,
    render: { strokeStyle: "#fe3a65", lineWidth: 4 }
  }));
}

Matter.Runner.run(Matter.Runner.create(), engine);
Matter.Render.run(render);

let isDragging = false;
const updatePlug = () => {
  if (!points.length) return;
  const lastPoint = points[points.length - 1].position;
  gsap.set(plug, { 
    x: lastPoint.x - startX, 
    y: lastPoint.y - startY - 20 
  });
};

function drag(e) {
  if (!isDragging) return;
  const y = (e.clientY || (e.touches && e.touches[0].clientY));
  const x = (e.clientX || (e.touches && e.touches[0].clientX));
  if (points.length) {
    Matter.Body.setPosition(points[points.length - 1], { x, y });
  }
  if (y > cardRect.top + 320) openCard();
}

plug.addEventListener("mousedown", () => isDragging = true);
plug.addEventListener("touchstart", (e) => { isDragging = true; e.preventDefault(); }, {passive: false});
document.addEventListener("mousemove", drag);
document.addEventListener("touchmove", drag, {passive: false});
document.addEventListener("mouseup", () => isDragging = false);
document.addEventListener("touchend", () => isDragging = false);

gsap.ticker.add(updatePlug);

function openCard() {
  if (card.classList.contains("opened")) return;
  card.classList.add("opened");
  
  confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

  gsap.to(".cord-wrapper", { 
    opacity: 0, 
    duration: 0.3, 
    onComplete: () => {
      document.querySelector(".cord-wrapper").style.display = "none";
      gsap.ticker.remove(updatePlug); 
      Matter.World.clear(world);
      Matter.Engine.clear(engine);
      if (render.canvas) render.canvas.remove();
    } 
  });

  gsap.to(".text-intro", { opacity: 0, duration: 0.3 });
  gsap.to(".card", { scale: 1.02, duration: 0.5 });
  gsap.to(".card-content", { display: "block", opacity: 1, duration: 0.8, delay: 0.2 });
}

// ────────────────────────────────────────────────
// NÚT BẤM – PHIÊN BẢN MƯỢT & SINH ĐỘNG
const yesBtn = document.querySelector(".yes");
const noBtn = document.querySelector(".no");
let runCount = 0;
let hasDisappeared = false;

noBtn.onmouseover = () => {
  if (hasDisappeared) return;

  const tl = gsap.timeline({ defaults: { ease: "power3.out", duration: 0.4 } });

  if (runCount < 5) {
    // 5 lần đầu: di chuyển ngẫu nhiên + xoay nhẹ + scale tí
    const x = (Math.random() - 0.5) * 220; // giới hạn chặt hơn
    const y = (Math.random() - 0.5) * 110;
    const rot = (Math.random() - 0.5) * 20;

    tl.to(noBtn, { x, y, rotation: rot, scale: 1.08 }, 0)
      .to(noBtn, { scale: 1, rotation: 0, duration: 0.3 }, 0.3);

    runCount++;
  } else {
    // Lần 6: bay ra ngoài mượt mà, cong đường, xoay + scale
    hasDisappeared = true;

    const direction = Math.random() > 0.5 ? 1 : -1;
    const escapeX = direction * (window.innerWidth * 0.6 + Math.random() * 200);
    const escapeY = (Math.random() - 0.5) * window.innerHeight * 0.4;

    tl.to(noBtn, {
      x: escapeX,
      y: escapeY,
      rotation: direction * 360,
      scale: 0.3,
      opacity: 0,
      duration: 1.1,
      ease: "power2.in",
      onComplete: () => {
        noBtn.style.visibility = "hidden";
        noBtn.style.pointerEvents = "none";
      }
    });
  }
};

yesBtn.onclick = () => {
  gsap.to(".valentine-main", { display: "none", opacity: 0 });
  gsap.to(".valentine-congrats", { display: "block", opacity: 1, duration: 0.6, ease: "back.out(1.7)" });
  confetti({ particleCount: 300, spread: 100, startVelocity: 45 });
};

noBtn.onclick = () => {
  // Nếu bấm được thì troll nhẹ
  gsap.to(noBtn, { scale: 0.1, duration: 0.4, ease: "back.in", onComplete: () => {
    alert("Haha né mãi vẫn bị bắt nhaaa 😏");
  }});
};
</script>
</body>
</html>
