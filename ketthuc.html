<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Will you be my Valentine? 💌</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10; /* Để sợi dây hiển thị trên cùng */
    }
    .wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url("https://images.unsplash.com/photo-1503455637927-730bce8583c0?q=80&w=2070&auto=format&fit=crop");
      background-size: cover;
      background-position: center;
    }
    .card {
      position: relative;
      width: 320px;
      height: 420px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }
    .card-content {
      padding: 20px;
      opacity: 0;
      display: none;
      text-align: center;
      z-index: 5;
    }
    /* Vùng chứa dây kéo */
    .cord-wrapper {
      position: absolute;
      top: 0; /* Bắt đầu từ mép trên của card */
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 100%;
      cursor: grab;
      z-index: 15;
    }
    .plug {
      position: absolute;
      width: 45px;
      height: 65px;
      fill: #fe3a65;
      cursor: grab;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
    .plug:active { cursor: grabbing; }

    .text-intro {
      position: absolute;
      bottom: 40px;
      color: #888;
      font-size: 18px;
      font-weight: 500;
      pointer-events: none;
    }

    /* Styles cho nội dung Valentine */
    h1 { color: #fe3a65; font-size: 24px; margin-bottom: 15px; }
    img { border-radius: 12px; width: 100%; max-width: 260px; margin-bottom: 15px; }
    .buttons { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
    button {
      padding: 10px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: 0.3s;
    }
    .yes { background: #4caf50; }
    .no { background: #f44336; }
    .footer-text {
      position: absolute;
      bottom: 15px;
      font-size: 11px;
      color: white;
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="wrapper">
  <div class="card">
    <p class="text-intro">Hãy kéo nó xuống ↓</p>
    
    <div class="card-content">
      <div class="valentine-main">
        <h1>Em có thích bất ngờ này không?</h1>
        <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2Vna2FkeDN2NHYxenduMXVuNTJ0MmJxZjI5dG16bXhoaGJuZmoxMyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26FLdmIp6wJr91JAI/giphy.gif" alt="please" />
        <div class="buttons">
          <button class="yes">Có chứ! ❤️</button>
          <button class="no">Không nha 😜</button>
        </div>
      </div>

      <div class="valentine-congrats" style="display:none;">
        <h1>Yêu em nhất! ❤️</h1>
        <p>Chúc mừng chúng mình có nhau!</p>
        <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExd2EwcDRyYXZyNjUwb2h0ZmRnd3R3d2wzMWRvNGR0ejBnMjduaHprYSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/n0IKF3qkeh671VAO45/giphy.gif" />
      </div>

      <div class="valentine-sad" style="display:none;">
        <h1>Ơ kìa... dỗi luôn!</h1>
        <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExbTF4aHN4Y2FqMnlvdGRwYnF6ZG5nZ2l3emRxeXNvcXlyemZkbDJjYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/kyrd72DC2Iwfu/giphy.gif" />
      </div>
    </div>

    <div class="cord-wrapper">
      <svg class="plug" viewBox="0 0 100 160">
        <path d="M30,0 L70,0 L90,40 L90,140 L10,140 L10,40 Z" />
        <circle cx="35" cy="20" r="5" fill="white"/>
        <circle cx="65" cy="20" r="5" fill="white"/>
      </svg>
    </div>
  </div>
  <div class="footer-text">Made with ❤️ by Shrikant • Adapted by Gemini</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const card = document.querySelector(".card");
const plug = document.querySelector(".plug");
const cardRect = card.getBoundingClientRect();

// Matter.js setup
const engine = Matter.Engine.create();
const world = engine.world;
const render = Matter.Render.create({
  element: document.getElementById("canvas-container"),
  engine: engine,
  options: {
    width: window.innerWidth,
    height: window.innerHeight,
    wireframes: false,
    background: "transparent"
  }
});

// Tạo các điểm nối cho sợi dây
const segments = 8;
const points = [];
const startX = window.innerWidth / 2;
const startY = cardRect.top + 10; // Dây bắt đầu từ trong card

for (let i = 0; i <= segments; i++) {
  const p = Matter.Bodies.circle(startX, startY + i * 15, 2, {
    isStatic: i === 0,
    friction: 0.5,
    render: { fillStyle: "#fe3a65" }
  });
  points.push(p);
  Matter.World.add(world, p);
}

for (let i = 0; i < points.length - 1; i++) {
  Matter.World.add(world, Matter.Constraint.create({
    bodyA: points[i], bodyB: points[i+1],
    stiffness: 0.2, length: 15,
    render: { strokeStyle: "#fe3a65", lineWidth: 4 }
  }));
}

Matter.Runner.run(Matter.Runner.create(), engine);
Matter.Render.run(render);

// Logic kéo dây
let isDragging = false;
const updatePlug = () => {
  const lastPoint = points[points.length - 1].position;
  gsap.set(plug, { 
    x: lastPoint.x - startX, 
    y: lastPoint.y - startY - 20 
  });
};

function drag(e) {
  if (!isDragging) return;
  const y = (e.clientY || e.touches[0].clientY);
  const x = (e.clientX || e.touches[0].clientX);
  Matter.Body.setPosition(points[points.length - 1], { x, y });
  
  // Nếu kéo xuống đủ sâu thì mở card
  if (y > cardRect.top + 300) openCard();
}

plug.addEventListener("mousedown", () => isDragging = true);
plug.addEventListener("touchstart", () => isDragging = true);
document.addEventListener("mousemove", drag);
document.addEventListener("touchmove", drag);
document.addEventListener("mouseup", () => isDragging = false);
document.addEventListener("touchend", () => isDragging = false);

gsap.ticker.add(updatePlug);

function openCard() {
  if (card.classList.contains("opened")) return;
  card.classList.add("opened");
  
  confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

  gsap.to(".text-intro", { opacity: 0, duration: 0.3 });
  gsap.to(".cord-wrapper", { opacity: 0, duration: 0.5, onComplete: () => {
    document.querySelector(".cord-wrapper").style.display = "none";
    points.forEach(p => Matter.World.remove(world, p));
  }});

  gsap.to(".card-content", { display: "block", opacity: 1, duration: 0.8, delay: 0.3 });
}

// Nút Yes/No
document.querySelector(".yes").onclick = () => {
  gsap.to(".valentine-main", { display: "none", opacity: 0 });
  gsap.to(".valentine-congrats", { display: "block", opacity: 1 });
  confetti({ particleCount: 200, spread: 100 });
};

document.querySelector(".no").onclick = () => {
  gsap.to(".valentine-main", { display: "none", opacity: 0 });
  gsap.to(".valentine-sad", { display: "block", opacity: 1 });
};

// Nút "No" chạy mất khi rê chuột vào
const noBtn = document.querySelector(".no");
noBtn.onmouseover = () => {
  const x = (Math.random() - 0.5) * 200;
  const y = (Math.random() - 0.5) * 200;
  gsap.to(noBtn, { x, y, duration: 0.2 });
};
</script>
</body>
</html>
